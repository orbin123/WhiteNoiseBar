<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src noise:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>WhiteNoiseBar</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="glass"><header><div class="library-control"><h1><button id="library-button" aria-label="Choose library: White noise" aria-expanded="false" aria-controls="library-menu" aria-haspopup="menu"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 7c3-4 7 4 10 0s7 4 10 0M2 12c3-4 7 4 10 0s7 4 10 0M2 17c3-4 7 4 10 0s7 4 10 0"/></svg></span><span id="library-title">White noise</span></button></h1><div id="library-menu" role="menu" aria-label="Libraries" hidden><button id="choose-white-noise" role="menuitemradio" aria-checked="true" data-library="white-noise"><span class="library-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 7c3-4 7 4 10 0s7 4 10 0M2 12c3-4 7 4 10 0s7 4 10 0M2 17c3-4 7 4 10 0s7 4 10 0"/></svg></span>White noise<span class="library-check" aria-hidden="true">✓</span></button><button id="choose-music" role="menuitemradio" aria-checked="false" data-library="music"><span class="library-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13M9 8l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>Music<span class="library-check" aria-hidden="true">✓</span></button></div></div><div class="volume-control"><button id="volume-button" aria-label="App volume" aria-expanded="false" aria-controls="volume-panel" title="App volume"></button><div id="volume-panel" hidden><div class="volume-heading"><label for="volume">App volume</label><output id="volume-value" for="volume">100%</output></div><input id="volume" type="range" min="0" max="100" step="1" value="100" aria-label="WhiteNoiseBar volume"></div></div></header>
<section class="player" aria-label="Playback controls"><button id="previous" aria-label="Previous track">|◀</button><button id="play" aria-label="Play" class="play">▶</button><button id="next" aria-label="Next track">▶|</button><button id="playback-mode" aria-label="Playback mode: Loop One" title="Loop One"></button></section>
<div class="section-label"><span id="library-label">YOUR SOUNDS</span><span id="count">03</span></div><div id="tracks" role="list" aria-label="Sound library"></div>
<button id="expand" class="capsule" aria-expanded="false" aria-controls="add-panel"><span id="plus">+</span> Add</button>
<section id="add-panel" hidden><form id="add-form"><label id="add-heading" for="url">A little more atmosphere</label><div class="input-row"><input id="url" type="url" placeholder="paste the link" aria-label="YouTube video link" required><button id="submit" type="submit">Add</button></div><p id="status" role="status" aria-live="polite">Paste a YouTube link to save its audio.</p></form></section>
<p id="playback-status" class="footer" role="status">A quieter space to focus.</p></main><script src="renderer.js"></script></body></html>
