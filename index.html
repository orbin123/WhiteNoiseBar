<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src noise:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>WhiteNoiseBar</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="glass"><header><span class="brand-mark">≋</span><h1>WhiteNoiseBar</h1><span class="live-dot" title="Ready"></span></header>
<section class="player" aria-label="Playback controls"><button id="previous" aria-label="Previous track">|◀</button><button id="play" aria-label="Play" class="play">▶</button><button id="next" aria-label="Next track">▶|</button><button id="shuffle" aria-label="Shuffle" aria-pressed="false" title="Shuffle track navigation">⇄</button></section>
<div class="section-label"><span>YOUR SOUNDS</span><span id="count">03</span></div><div id="tracks" role="list" aria-label="Sound library"></div>
<button id="expand" class="capsule" aria-expanded="false" aria-controls="add-panel"><span id="plus">+</span> Add</button>
<section id="add-panel" hidden><form id="add-form"><label for="url">A little more atmosphere</label><div class="input-row"><input id="url" type="url" placeholder="paste the link" aria-label="YouTube video link" required><button id="submit" type="submit">Add</button></div><p id="status" role="status" aria-live="polite">Paste a YouTube link to save its audio.</p></form></section>
<p id="playback-status" class="footer" role="status">A quieter space to focus.</p></main><script src="renderer.js"></script></body></html>
